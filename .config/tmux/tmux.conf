# Enable mouse support
set -g mouse on

# Increase scrollback buffer size
set -g history-limit 50000

# Enable system clipboard integration
set -g set-clipboard on

# Use 'v' to begin selection, like in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Use 'y' to yank (copy) the selection to the system clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# Copy to clipboard on mouse release, but stay in copy mode
# bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "xclip -selection clipboard"

# Use vi keys in copy mode
set-window-option -g mode-keys vi

# switch prefix to control-a, unmap b, allow double-a to go through
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Use 256-color mode with true color (if supported by your terminal)
set -as terminal-overrides ',xterm-256color:Tc'

# Use modern terminal capabilities
set -g default-terminal "tmux-256color"

set -sg escape-time 50

set -g bell-action none

# Pass OSC sequences (e.g. OSC 7 for CWD) through to the terminal emulator
set -g allow-passthrough all

# --- Navigation (Vim Style) ---
# Use Ctrl+a then h/j/k/l to switch panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Resizing (Vim Style) ---
# Use Ctrl+a then Shift+h/j/k/l to resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Terminator Style Splits
# 'e' for Vertical (Side-by-Side)
bind e split-window -h -c "#{pane_current_path}"

# 'o' for Horizontal (Top-Bottom)
bind o split-window -v -c "#{pane_current_path}"

# Enable RGB (truecolor) support
set -as terminal-features ",xterm-256color:RGB"

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# --- Status bar (gruvbox, bottom) ---
# Keeps the default layout (session + windows left, pane title + clock right)
# but tinted to gruvbox with rounded Nerd Font pills.
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#282828,fg=#ebdbb2"

# Left: session pill; turns orange while the prefix (C-a) is held.
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[fg=#fb4934],#[fg=#fabd2f]}#[bg=default]#{?client_prefix,#[bg=#fb4934],#[bg=#fabd2f]}#[fg=#282828,bold]#S#{?client_prefix,#[fg=#fb4934],#[fg=#fabd2f]}#[bg=default] "

# Windows: dim inactive, blue pill for the active one.
set -g window-status-separator "  "
set -g window-status-format "#[fg=#a89984]#I:#W"
set -g window-status-current-format "#[fg=#fe8019]#[fg=#282828,bg=#fe8019,bold]#I:#W#[fg=#fe8019,bg=default]"

# Right: pane title, then clock and date pills.
set -g status-right-length 80
set -g status-right "#[fg=#a89984]#{=30:pane_title}  #[fg=#3c3836]#[bg=#3c3836,fg=#ebdbb2]%H:%M#[fg=#3c3836,bg=default] #[fg=#3c3836]#[bg=#3c3836,fg=#ebdbb2]%d-%b#[fg=#3c3836,bg=default] "

# Match pane borders to the theme.
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#d79921"
